<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Admin - Harmani Bike Blitar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif;}
        body{background:#F8FAFC; padding:30px 20px; max-width:900px; margin:0 auto;}
        .judul{text-align:center; margin-bottom:40px;}
        .judul h1{color:#165DFF; margin-bottom:10px;}
        .kotak{background:#fff; border-radius:16px; padding:30px; margin-bottom:25px; box-shadow:0 5px 20px rgba(0,0,0,0.05);}
        .kotak h3{margin-bottom:20px; color:#1E293B; border-bottom:1px solid #E2E8F0; padding-bottom:10px;}
        .grup{margin-bottom:18px;}
        label{display:block; margin-bottom:8px; font-weight:500; color:#334155;}
        input,textarea,select{width:100%; padding:12px; border:1px solid #CBD5E1; border-radius:10px; font-size:15px;}
        .tombol{padding:12px 24px; border:none; border-radius:10px; font-weight:600; cursor:pointer; transition:0.3s; font-size:15px; margin-right:10px; margin-top:10px;}
        .tombol-biru{background:#165DFF; color:#fff;}
        .tombol-hijau{background:#10B981; color:#fff;}
        .tombol-merah{background:#EF4444; color:#fff;}
        .paket-item{border:1px solid #E2E8F0; border-radius:12px; padding:20px; margin-bottom:15px; background:#FAFBFC;}
        .baris-fitur{display:flex; gap:10px; margin-bottom:8px;}
        .baris-fitur input{flex:1;}
        .login{max-width:420px; margin:60px auto; text-align:center; padding:35px; background:#fff; border-radius:16px; box-shadow:0 5px 20px rgba(0,0,0,0.05);}
        .login input{text-align:center; font-size:17px; margin-bottom:15px;}
        .pesan{padding:12px; border-radius:10px; margin-bottom:15px; display:none;}
        .pesan.sukses{background:#D1FAE5; color:#065F46;}
        .pesan.gagal{background:#FEE2E2; color:#991B1B;}
        .sembunyi{display:none;}
    </style>
</head>
<body>
    <div class="login" id="halamanLogin">
        <h2>Masuk Pengaturan Admin</h2>
        <p style="margin:15px 0; color:#64748B;">Masukkan kata sandi untuk mengubah data website</p>
        <input type="password" id="sandiAdmin" placeholder="Kata sandi admin">
        <br><button class="tombol tombol-biru" onclick="cekSandi()">Masuk Sekarang</button>
    </div>

    <div id="halamanAdmin" class="sembunyi">
        <div class="judul">
            <h1><i class="fa fa-cogs"></i> Pengaturan Harmani Bike Blitar</h1>
            <p>Perubahan akan langsung tampil di website</p>
            <a href="index.html" style="display:inline-block; margin-top:10px; color:#165DFF;"><i class="fa fa-arrow-left"></i> Kembali ke Website</a>
        </div>

        <div class="pesan sukses" id="pesanSukses"><i class="fa fa-check-circle"></i> Data berhasil disimpan!</div>
        <div class="pesan gagal" id="pesanGagal"><i class="fa fa-exclamation-triangle"></i> Gagal menyimpan data!</div>

        <div class="kotak">
            <h3>Informasi Umum Bengkel</h3>
            <div class="grup"><label>Jam Operasional</label><input type="text" id="inputJam" placeholder="Contoh: Senin-Sabtu 08.00 - 17.00 | Minggu Libur"></div>
            <div class="grup"><label>Alamat Lengkap</label><input type="text" id="inputAlamat" value="Jl. Pancasila No. 5, Desa Sukosewu, Kec. Gandusari, Kab. Blitar"></div>
        </div>

        <div class="kotak">
            <h3>Daftar Paket & Harga</h3>
            <div id="wadahPaket"></div>
            <button class="tombol tombol-biru" onclick="tambahPaket()"><i class="fa fa-plus"></i> Tambah Paket Baru</button>
        </div>

        <div style="text-align:center; margin-top:30px;">
            <button class="tombol tombol-hijau" onclick="simpanSemua()"><i class="fa fa-cloud-upload"></i> Simpan ke Database</button>
            <button class="tombol tombol-merah" onclick="keluar()"><i class="fa fa-sign-out"></i> Keluar</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyDFyjlzBDBZ4nXe8zTgNGdrKC4L9W--ImE",
  authDomain: "harmanibike.firebaseapp.com",
  databaseURL: "https://harmanibike-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "harmanibike",
  storageBucket: "harmanibike.firebasestorage.app",
  messagingSenderId: "1044181656443",
  appId: "1:1044181656443:web:d62e7cfe222519a88ed3de"
};

        const SANDI_ADMIN = "bengkel123";
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ref = db.ref('konten_website');

        function cekSandi(){
            const sandi = document.getElementById('sandiAdmin').value;
            if(sandi === SANDI_ADMIN){
                document.getElementById('halamanLogin').classList.add('sembunyi');
                document.getElementById('halamanAdmin').classList.remove('sembunyi');
                ambilData();
            }else{
                alert("Kata sandi salah!");
            }
        }

        function ambilData(){
            ref.once('value').then(snap => {
                const data = snap.val() || {
                    jamBuka: "Senin-Sabtu: 08.00 - 17.00 | Minggu Libur",
                    alamat: "Jl. Pancasila No. 5, Desa Sukosewu, Kec. Gandusari, Kab. Blitar",
                    daftarHarga: [
                        {nama:"Servis Ringan", harga:"Rp 35.000", desc:"Pengecekan dasar", populer:false, fitur:["Pelumasan rantai","Penyetelan rem","Pengecekan ban"]},
                        {nama:"Servis Lengkap", harga:"Rp 75.000", desc:"Paling banyak dipilih", populer:true, fitur:["Semua layanan ringan","Bersihkan gir","Stel gigi halus"]},
                        {nama:"Servis Premium", harga:"Rp 120.000", desc:"Perawatan maksimal", populer:false, fitur:["Semua lengkap","Bongkar bersih total","Ganti oli suspensi"]}
                    ]
                };
                document.getElementById('inputJam').value = data.jamBuka;
                document.getElementById('inputAlamat').value = data.alamat;
                tampilkanPaket(data.daftarHarga);
            });
        }

        function tampilkanPaket(list){
            const wadah = document.getElementById('wadahPaket');
            wadah.innerHTML = "";
            list.forEach((p, i) => {
                const el = document.createElement('div');
                el.className = "paket-item";
                el.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h4>Paket ${i+1}</h4>
                        <button class="tombol tombol-merah" style="padding:6px 12px; font-size:13px;" onclick="hapusPaket(${i})"><i class="fa fa-trash"></i> Hapus</button>
                    </div>
                    <div class="grup"><label>Nama Paket</label><input type="text" class="nama" value="${p.nama}"></div>
                    <div class="grup"><label>Harga</label><input type="text" class="harga" value="${p.harga}"></div>
                    <div class="grup"><label>Deskripsi</label><input type="text" class="desc" value="${p.desc}"></div>
                    <div class="grup"><label>Tampilkan Populer?</label><select class="populer"><option value="true" ${p.popular ? 'selected' : ''}>Ya</option><option value="false" ${p.popular ? '' : 'selected'}>Tidak</option></select></div>
                    <div class="grup"><label>Daftar Fitur</label>
                        <div class="daftar-fitur">
                            ${p.fitur.map(f => `<div class="baris-fitur"><input type="text" class="input-fitur" value="${f}"><button class="tombol tombol-merah" style="padding:8px 10px;" onclick="this.parentElement.remove()"><i class="fa fa-times"></i></button></div>`).join('')}
                        </div>
                        <button class="tombol tombol-biru" style="padding:8px 12px; font-size:13px; margin-top:5px;" onclick="tambahFitur(this)"><i class="fa fa-plus"></i> Tambah Fitur</button>
                    </div>
                `;
                wadah.appendChild(el);
            });
        }

        function tambahPaket(){
            ref.once('value').then(snap => {
                const data = snap.val() || {daftarHarga:[]};
                data.daftarHarga.push({nama
